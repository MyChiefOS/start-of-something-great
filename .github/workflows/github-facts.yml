# GitHub's facts come only from GitHub (RISKS.md RK140; migration 055). This reads this repository's pull requests and
# its issues labelled "task" from GitHub's API, here inside GitHub, with this run's own token, and sends them to the
# Supabase function dog-github with a short-lived GitHub identity token. dog-github accepts only this file, on main, in
# this repository, for the events below, each token once, and records the facts as dog_ghsync, the one database role
# that may. The site's own role can't. There is no secret anywhere: no database password, no Supabase key, nothing to
# paste. Each run reads everything afresh (db/workjobs.js, gather), so a missed or repeated event changes nothing.
# Since 057 (RK135, RK112) it also reads the changed files of the merged pull requests Third Look is waiting to read
# (dog-github says which) and Aaron's decisions on proposals, from their labels; dog-github records both as dog_ghsync.
# A failed run records nothing and passes nothing; work on a pull request waits for its facts (055: once none has
# arrived for 6 hours, a claim running out no longer fails it). It alerts on the
# "JEVs alerts" issue, at most once a day, and GitHub emails the failure as for any run.
name: GitHub facts

on:
  # A pull request opened, pushed to, reopened, or closed and merged. 088 (Aaron's plan, Phase 1 item 2: scan at
  # submission): its files are scanned when it arrives and after each push, not only once it closes.
  # RK163: when the PR relay completes (workflow_run), not pull_request_target, which GitHub blocks in public
  # repositories from Dec 2, 2026. workflow_run runs main's copy of this file, on main, so the identity token names main
  # and this file, which is all dog-github accepts. Nothing from the pull request is checked out here, and no text from
  # the event is read: the run reads GitHub's API afresh. Its runnable files run only in the sandbox job below, which
  # holds no identity token and no write permission.
  workflow_run:
    workflows: [PR relay]
    types: [completed]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  # The backstop: anything an event missed, every half hour (GitHub runs schedules when it can, not to the minute).
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

# Each job gets only what it needs (the independent review of PR 2, F7): the job that reads public pull request and issue
# text can't write anything to GitHub; only the alert job, which reads no event text, may comment.
permissions: {}

# One run at a time. A run waiting behind another is replaced by the newest, which reads everything afresh anyway.
concurrency:
  group: github-facts
  cancel-in-progress: false

jobs:
  # 095: which links submitted for work the link sandbox should open (dog-github, mode "links"). This job asks and does
  # nothing else: it checks nothing out, runs no code from anywhere and opens no link. Its identity token is used for
  # that one request. The list goes to the link sandbox as a job output, read there only through an environment variable.
  links:
    if: github.repository_id == 1418125608 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # only to ask GitHub for the identity token dog-github checks
    timeout-minutes: 5
    env:
      FN_URL: https://nksagchwpyljvjiwolmp.supabase.co/functions/v1/dog-github
    outputs:
      links: ${{ steps.ask.outputs.links }}
    steps:
      - name: Ask dog-github which links to open
        id: ask
        run: |
          set -uo pipefail
          t=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$FN_URL" | jq -r .value) || t=''
          echo "::add-mask::$t"
          code=$(curl -sS --max-time 60 -o links.json -w '%{http_code}' -X POST "$FN_URL" \
            -H "Authorization: Bearer $t" -H 'Content-Type: application/json' --data '{"mode":"links"}') || code=none
          unset t
          # Only ids and https or http links, at most 5; anything else is no links (never a failed run).
          if [ "$code" = 200 ] && jq -e '.ok == true and (.links | type == "array")' links.json > /dev/null 2>&1; then
            jq -c '[.links[:5][] | select((.id | type == "string") and (.id | test("^[0-9a-f-]{36}$")) and (.url | type == "string") and (.url | length <= 2000) and (.url | test("^https?://")))]' links.json > list.json
          else
            echo "dog-github answered $code when asked for links"
            echo '[]' > list.json
          fi
          echo "links=$(jq -c . list.json)" >> "$GITHUB_OUTPUT"
          echo "$(jq length list.json) link(s) to open"

  # 095: the link sandbox (wall/links.js). Opens each listed link in headless Chrome inside bubblewrap: a fresh profile in
  # an empty /tmp, a read-only disk, no environment, its own network namespace. The only way out is a Unix socket to a
  # proxy that lets through HTTPS (port 443) to that link's own host and refuses every other host and every private,
  # local or cloud-metadata address. Downloads are denied and recorded. Like the sandbox above: no identity token, no
  # write permission, no secret; it reads nothing from GitHub. Its findings reach the facts job only as a job output.
  link_sandbox:
    needs: links
    if: always() && github.repository_id == 1418125608 && github.ref == 'refs/heads/main' && needs.links.outputs.links != '' && needs.links.outputs.links != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      findings: ${{ steps.run.outputs.findings }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            /wall/links.js
            /wall/link-inner.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install the sandbox (bubblewrap) from Ubuntu's own packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap > /dev/null
          # Ubuntu 24.04 limits unprivileged user namespaces through AppArmor; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null || true
          # The runner image's own Google Chrome; the run flags every link "could not be opened" (W51b) without it.
          command -v google-chrome || echo "no Chrome on this runner"
      - name: Open the listed links in the sandbox
        id: run
        env:
          WALL_LINKS_WANTED: ${{ needs.links.outputs.links }}
        run: |
          set -uo pipefail
          out=$(node wall/links.js 2>/dev/null || echo '{}')
          printf '%s' "$out" | head -c 400000 > findings.json
          jq -e 'type == "object"' findings.json > /dev/null 2>&1 || echo '{}' > findings.json
          echo "findings=$(jq -c . findings.json)" >> "$GITHUB_OUTPUT"
          # Counts only in the public log: the flags quote submitted links (094 review).
          jq -r '"links with findings: " + ([to_entries[] | select(.value.flags | length > 0)] | length | tostring)' findings.json || true

  # 088: the Wall's sandbox (wall/sandbox.js). Runs the recently pushed pull requests' runnable files in bubblewrap with
  # no network, a read-only disk and no environment, and hands its findings to the facts job as JSON. This job can read
  # the repository and nothing else: no identity token, no write permission, no secret.
  sandbox:
    if: github.repository_id == 1418125608 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    outputs:
      findings: ${{ steps.run.outputs.findings }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            /db/
            /api/_proposals.js
            /api/_secrets.js
            /signin/crypto.js
            /wall/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install the sandbox (bubblewrap, strace) from Ubuntu's own packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap strace > /dev/null
          # Ubuntu 24.04 limits unprivileged user namespaces through AppArmor; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null || true
      - name: Run the recently pushed pull requests' runnable files in the sandbox
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          out=$(node wall/sandbox.js 2>/dev/null || echo '{}')
          printf '%s' "$out" | head -c 900000 > findings.json
          jq -e 'type == "object"' findings.json > /dev/null 2>&1 || echo '{}' > findings.json
          echo "findings=$(jq -c . findings.json)" >> "$GITHUB_OUTPUT"
          jq -r 'to_entries[] | select(.value | length > 0) | .key + ": " + (.value | join(" | "))' findings.json || true

  facts:
    needs: [sandbox, link_sandbox]
    # The facts run even when a sandbox didn't (its findings are then missing, and the files are scanned without them;
    # 095: a link the link sandbox didn't open is asked for again by the next run).
    if: always() && github.repository_id == 1418125608 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # only to ask GitHub for the identity token dog-github checks
    timeout-minutes: 20
    env:
      FN_URL: https://nksagchwpyljvjiwolmp.supabase.co/functions/v1/dog-github
    steps:
      # main's own code (for pull_request_target too: the default branch), only the files the read needs; no packages.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            /db/
            /api/_proposals.js
            /api/_secrets.js
            /signin/crypto.js
            /wall/files.js
            /wall/yara.js
            /wall/vendor/libyara-wasm.js
            /wall/clamav.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      # 088: ClamAV, from Ubuntu's own packages, with today's signatures from ClamAV's free updates. If either fails,
      # the run goes on and every scanned file gets W46b (the check didn't run), never a silent pass.
      - name: Install the antivirus (ClamAV) and fetch its signatures
        id: clamav
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav > /dev/null
          sudo systemctl stop clamav-freshclam 2> /dev/null || true
          sudo freshclam --quiet
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Read GitHub's facts and send them to dog-github
        env:
          GH_TOKEN: ${{ github.token }}
          WALL_CLAMAV: '1'
          WALL_SANDBOX: ${{ needs.sandbox.outputs.findings }}
          WALL_LINKS: ${{ needs.link_sandbox.outputs.findings }}
        run: |
          set -euo pipefail
          # $1: the request file, $2: the answer file; sets $code. Each request gets a fresh token: dog-github accepts each once.
          post() {
            local t
            t=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$FN_URL" | jq -r .value)
            echo "::add-mask::$t"
            code=$(curl -sS --max-time 120 -o "$2" -w '%{http_code}' -X POST "$FN_URL" \
              -H "Authorization: Bearer $t" -H 'Content-Type: application/json' --data-binary @"$1") || code=none
            unset t
          }
          echo '{"mode":"wanted"}' > ask.json
          post ask.json wanted.json
          if [ "$code" != 200 ]; then
            echo "dog-github answered $code when asked which merged pull requests it wants read"
            jq -c '{error}' wanted.json 2>/dev/null || true
            exit 1
          fi
          node db/workjobs.js gather wanted.json requests
          failed=0
          for f in requests/*.json; do
            post "$f" answer.json
            if [ "$code" = 200 ]; then
              jq -c '{prs, tasks, closed, files, proposals}' answer.json
            else
              echo "dog-github answered $code to $(basename "$f")"
              jq -c '{error}' answer.json 2>/dev/null || true
              failed=1
            fi
          done
          [ "$failed" = 0 ]

  alert:
    needs: [sandbox, facts]
    if: always() && needs.facts.result == 'failure' && github.repository_id == 1418125608 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # only to add the alert to the "JEVs alerts" issue
    steps:
      - name: Alert when a run fails (the "JEVs alerts" issue, at most once a day)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh api "repos/$REPO/labels/jevs-alert" > /dev/null 2>&1 || \
            gh api "repos/$REPO/labels" -f name=jevs-alert -f color=b60205 -f description='JEVs flagged a post for review' > /dev/null
          issue=$(gh api "repos/$REPO/issues?labels=jevs-alert&state=open&per_page=1" --jq '.[0].number // empty')
          [ -n "$issue" ] || issue=$(gh api "repos/$REPO/issues" -f title='JEVs alerts' -f body='JEVs adds a comment here for every post it flags, every run that fails, and any database drift.' -f 'labels[]=jevs-alert' --jq .number)
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api "repos/$REPO/issues/$issue/comments?since=$since&per_page=100" --jq '[.[] | select(.body | startswith("GitHub facts:"))] | length' || echo 0)
          if [ "${recent:-0}" != 0 ]; then echo "Already alerted in the last 24 hours."; exit 0; fi
          {
            echo "GitHub facts: a run failed, so this repository's pull requests and issues weren't recorded this time."
            echo "Nothing passes and nobody is locked out while this lasts: work on a pull request waits for its facts, and once none has arrived for 6 hours a claim running out no longer fails it. Later failures today aren't posted again."
            echo
            echo "Run: $RUN_URL"
          } > alert.txt
          gh api "repos/$REPO/issues/$issue/comments" -F body=@alert.txt > /dev/null
          echo "alert added"
