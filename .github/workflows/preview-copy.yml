# The preview copy (RK141; design/preview-copy.md, "Building and reseeding the copy"). On each merge to main, and by
# hand, this rebuilds the one Supabase preview branch's database from main: it empties the copy, applies every
# migration of the merged commit, and reseeds it with made-up data. It asks GitHub for a short-lived identity token
# addressed to the branch's own dog-copy function (supabase/functions/dog-copy, deployed only to the branch), which accepts only
# this workflow on main, at the branch's own address. Production's runner refuses that token twice over (its address
# and its workflow are database.yml's), and the branch's runner refuses production's. No secret anywhere.
#
# A separate workflow, not a job in database.yml: production's migrations keep their own workflow, triggers, rights
# and queue, a failed rebuild of the copy never marks production's run failed or holds up its drift check, and the
# workflow name in the token keeps the two runners apart even if an address were ever wrong.
#
# Until the branch exists and a follow-up commit fixes its reference below (the same value as db/sitekeys.js
# PREVIEW_REF; test/preview-migrate.test.js checks they match), it does nothing and says so. A failed rebuild fails
# this run, and GitHub tells the owner; it never blocks anything else, and the old copy stays as it was.
name: Preview copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # only to ask GitHub for the identity token the branch's runner checks

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.repository_id == 1418125608 && github.ref == 'refs/heads/main'
    concurrency:
      group: preview-copy
      cancel-in-progress: false
    env:
      # The preview branch's Supabase project reference, fixed in code once the branch exists. Empty: nothing to do.
      PREVIEW_REF: ''
    steps:
      - name: Rebuild and reseed the preview copy through its own runner
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_REF" ]; then
            echo "The preview copy's branch isn't fixed in code yet (PREVIEW_REF is empty): nothing to rebuild." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "$PREVIEW_REF" =~ ^[a-z]{20}$ ]] || [ "$PREVIEW_REF" = nksagchwpyljvjiwolmp ]; then
            echo "Refused: PREVIEW_REF is not a preview branch's reference (it is malformed, or it is production's)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          RUNNER_URL="https://$PREVIEW_REF.supabase.co/functions/v1/dog-copy"
          # After a merge that changes the runner, Claude deploys it to the branch from the merged commit (OPERATIONS.md);
          # until it answers, wait for it (up to 10 minutes) rather than fail. Each try gets a fresh token, because the
          # runner accepts each token once.
          code=none
          for try in $(seq 1 20); do
            token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RUNNER_URL" | jq -r .value)
            echo "::add-mask::$token"
            rm -f result.json
            code=$(curl -sS --max-time 300 -o result.json -w '%{http_code}' -X POST "$RUNNER_URL" \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data '{"mode":"rebuild"}') || true
            unset token
            # A 401 counts as final only if it is the runner's own refusal; Supabase's gateway answering means the
            # runner isn't in place yet.
            if [ "$code" = 401 ] && ! jq -e '(.error // "") | startswith("refused: ")' result.json > /dev/null 2>&1; then code=not-ready; fi
            case "$code" in
              200|500|400|401|405|413) break ;;
              *) echo "the copy's runner is not ready yet ($code), try $try of 20"; sleep 30 ;;
            esac
          done
          [ -f result.json ] || echo '{"ok":false,"error":"the runner never answered"}' > result.json
          {
            echo "## Preview copy rebuilt from ${GITHUB_SHA:0:7}"
            echo
            jq -r '"- Result: " + (if .ok then "passed" else "FAILED" end),
                   "- Migrations applied: " + ((.applied // []) | length | tostring) + " of " + ((.total // "?") | tostring),
                   "- Seeded: " + ((.seeded // {}) | to_entries | map(.key + " " + (.value | tostring)) | join(", ")),
                   (if (.failed // []) | length > 0 then "- Checks failed: " + (.failed | join("; ")) else empty end),
                   (if .error then "- Error: " + .error else empty end)' result.json || cat result.json
            echo "- Answer: $code"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ] && jq -e '.ok == true' result.json > /dev/null
