# Check U1 in ACCEPTANCE.md: the site, API and MCP server are checked every 15 minutes.
# A confirmed failure opens one "uptime" issue (GitHub notifies the owner); recovery closes it.
name: Uptime monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # And right after every successful production deploy (Oct 17): the go-live gate, sign-in and headers included.
  deployment_status:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    # Deploys: only a successful Production deployment; every other deployment event is skipped.
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Check the site, API and MCP server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set by the Production setup run's stage step; the live stage must match it (D1).
        run: node scripts/uptime.js
