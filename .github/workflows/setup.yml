# Production setup: the database, the site's login role, the sign-in keys, the go-live stage and the administrator,
# done from GitHub so nothing runs on anyone's own computer and no secret is ever shown to a person (SETUP.md).
# Started by hand only (Actions tab, "Production setup", Run workflow, on main). Its secrets live in the protected
# "production" environment: only main, and only after Aaron approves the run.
name: Production setup

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Steps, comma separated: database, keys, stage, admin, redeploy (always run in that order)'
        required: true
        default: 'database,keys,stage,redeploy'
      stage:
        description: 'Go-live stage for the "stage" step. closed keeps Release 2 off; public is the go-live decision.'
        type: choice
        options: [closed, preview, public]
        default: closed
      preview_allow:
        description: 'For the preview: who may make an account, like github:12345 (numeric account ID; see SETUP.md)'
        required: false
        default: ''
      admin_member_id:
        description: 'For the "admin" step: your member_id from https://dayonegreat.com/auth/me after signing in once'
        required: false
        default: ''
      rotate_db_password:
        description: 'Give the site''s login role a new password (and update DATABASE_URL to match)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Shares the migrations' group, so a setup and a migration run never overlap.
  group: database-migrations
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Set up production
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_CA: ${{ secrets.MIGRATION_DATABASE_CA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SETUP_STEPS: ${{ inputs.steps }}
          SETUP_STAGE: ${{ inputs.stage }}
          SETUP_PREVIEW_ALLOW: ${{ inputs.preview_allow }}
          SETUP_ADMIN_MEMBER_ID: ${{ inputs.admin_member_id }}
          SETUP_ROTATE_DB_PASSWORD: ${{ inputs.rotate_db_password && 'yes' || 'no' }}
        run: node scripts/setup-production.js
