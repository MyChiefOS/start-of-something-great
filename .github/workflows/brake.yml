# The brake (USE-CASES.md row 12): the last resort in a live attack. When a merged PR changes moderation/brake to
# "on", every open discussion is locked, so nobody can post until a merged PR sets it back to "off", which unlocks
# them. It stops everyone, so nothing ever switches it on automatically. Reading stays open throughout.
name: Brake

on:
  push:
    branches: [main]
    paths: ['moderation/brake']
  workflow_dispatch:

permissions:
  contents: read
  discussions: write # only to lock and unlock discussions

concurrency:
  group: brake
  cancel-in-progress: false

jobs:
  brake:
    if: github.repository_id == 1418125608 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            /moderation/
          sparse-checkout-cone-mode: false

      - name: Lock or unlock every discussion
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          state=$(tr -d '[:space:]' < moderation/brake)
          case "$state" in on) op=lockLockable ;; off) op=unlockLockable ;; *) echo "moderation/brake must be on or off"; exit 1 ;; esac
          gh api graphql -f query='query($o: String!, $n: String!) { repository(owner: $o, name: $n) { discussions(first: 100, states: OPEN) { nodes { id } } } }' \
            -f o="$OWNER" -f n="${NAME:-start-of-something-great}" --jq '.data.repository.discussions.nodes[].id' > ids.txt
          count=0
          while IFS= read -r id; do
            gh api graphql -f query="mutation(\$id: ID!) { $op(input: {lockableId: \$id}) { clientMutationId } }" -f id="$id" > /dev/null
            count=$((count + 1))
          done < ids.txt
          echo "Brake $state: $count discussion(s)" | tee -a "$GITHUB_STEP_SUMMARY"
