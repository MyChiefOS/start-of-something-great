# The red-team copy for Aaron's own attack plans (RK141; harness/STANDARDS.md gap 1). Aaron (or an agent he directs)
# writes a plan as a ```json block in an issue and labels it red-team; this runs it against a throwaway copy of the
# site's API and database built here, with made-up accounts, and comments the report on the issue. Nothing reaches the
# live site, and no secret is used. Only the repository owner's own issues, labelled by the owner, run: anyone else's
# plan, or label, is ignored. The plan is data read by redteam/issue.js from GitHub's event file; no issue text reaches
# a shell. The code that runs is main's (an issues event checks out the default branch).
name: Red team

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: red-team-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.label.name == 'red-team' && github.event.sender.login == 'MyChiefOS' && github.event.issue.user.login == 'MyChiefOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Run the plan against a throwaway copy and comment the report
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node redteam/issue.js
