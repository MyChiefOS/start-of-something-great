# The healer's patch gate for code (096; Aaron, Nov 27: "We need automated patch testing to ensure the patch does not
# break anything"). On a healer pull request (branch heal/..., or labelled "heal"): the full suite, the assurance suite,
# the honest-corpus check and the incident's regression tests. If any fails, the pull request is put back to draft, so
# it can't be marked ready until all pass. Aaron still merges; nothing here merges or approves.
name: Heal gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: heal-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: startsWith(github.head_ref, 'heal/') || contains(github.event.pull_request.labels.*.name, 'heal') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'heal/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Full suite
        id: full
        run: npm test
      - name: Assurance suite (the Wall, the firewall, hidden characters, the break-in and red-team tests, the healer)
        id: assurance
        if: always()
        run: node --test --test-concurrency=1 test/full-wall.test.js test/firewall.test.js test/hidden-unicode.test.js test/breakin.test.js test/redteam*.test.js test/self-heal.test.js
      - name: Honest corpus (every draft rule against the golden set)
        id: corpus
        if: always()
        run: node heal/corpus-check.js heal/drafts
      - name: The incidents' regression tests
        id: regression
        if: always()
        run: |
          if ls test/heal/*.test.js >/dev/null 2>&1; then node --test --test-concurrency=1 test/heal/*.test.js; else echo "no regression tests"; fi
      - name: Not ready until every check passes
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          n="${PR:-$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq '.[0].number')}"
          if [ -n "$n" ] && [ "$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ]; then
            gh pr ready "$n" --undo --repo "$GITHUB_REPOSITORY"
          fi
