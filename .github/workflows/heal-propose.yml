# The healer's code proposals (096): run by hand with the incidents an administrator exported (the JSON heal/propose.js
# reads). It writes the regression tests and draft rules to a new heal/... branch and opens a draft pull request
# labelled "heal" for Aaron. It never pushes to main, never marks the pull request ready and never merges.
name: Heal proposals

on:
  workflow_dispatch:
    inputs:
      incidents:
        description: 'The exported incidents, as JSON'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Write the proposals
        env:
          INCIDENTS: ${{ github.event.inputs.incidents }}
        run: |
          printf '%s' "$INCIDENTS" > "$RUNNER_TEMP/incidents.json"
          node heal/propose.js --incidents "$RUNNER_TEMP/incidents.json" > "$RUNNER_TEMP/body.md"
      - name: Open a draft pull request for Aaron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="heal/$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          git add test/heal heal/drafts
          git -c user.name="healer" -c user.email="healer@users.noreply.github.com" commit -m "Healer: regression tests and draft rules"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" --label heal --title "Healer: regression tests and draft rules" --body-file "$RUNNER_TEMP/body.md"
