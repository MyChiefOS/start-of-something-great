# Backup restore test (O2, RISKS.md RK12): rebuilds the live data in a throwaway database inside this run and checks
# every table matches. Started by hand only (Actions tab, "Restore test", on main), in the protected "production"
# environment, so Aaron approves each run. The copy never leaves the runner and is never uploaded.
name: Restore test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    if: github.ref == 'refs/heads/main'
    services:
      postgres:
        # The same major version as Supabase (17).
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Install the Postgres 17 tools (pg_dump must be as new as the server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Restore the live data into a throwaway database and compare
        env:
          SOURCE_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SOURCE_DATABASE_CA: ${{ secrets.MIGRATION_DATABASE_CA }}
          TARGET_DATABASE_URL: postgres://postgres:throwaway@localhost:5432/postgres
        run: node scripts/restore-test.js
