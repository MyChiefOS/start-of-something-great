# The only way the database changes (USE-CASES.md row 15). When a merge to main changes db/migrations or db/reset,
# this asks GitHub for a short-lived identity token and hands it to the runner (supabase/functions/dog-migrate). The
# runner checks that the token is from this workflow on main, then applies the files of that exact commit and records
# the run in app.change_log. There is no secret anywhere: no database password, no Supabase key, nothing to paste.
# The result goes in this run's summary and as a comment on the merged pull request. A failed run fails loudly
# (GitHub emails the owner) and leaves nothing half-applied: the whole run is one transaction.
name: Database migrations

on:
  push:
    branches: [main]
    paths: ['db/migrations/**', 'db/reset/**', 'db/manifest.json']
  workflow_dispatch:
  # The drift check (USE-CASES.md row 17): once a day, compare the live ledger with main. It only reads.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  id-token: write # only to ask GitHub for the identity token the runner checks
  pull-requests: write # only to comment the result on the merged pull request
  issues: write # only for the drift check to add an alert

# The concurrency group is on the migrate job, not the workflow: GitHub cancels a pending run when another queues in
# the same group, and a scheduled drift check must never replace a pending migration.

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    concurrency:
      group: database-migrations
      cancel-in-progress: false
    env:
      RUNNER_URL: https://nksagchwpyljvjiwolmp.supabase.co/functions/v1/dog-migrate
    steps:
      - name: Apply the merged commit through the runner
        id: run
        run: |
          set -euo pipefail
          # A new runner is deployed from the merged commit right after merge (OPERATIONS.md). Until it answers,
          # the old one replies 410; wait for it (up to 40 minutes) rather than fail. Each try gets a fresh token,
          # because the runner accepts each token once.
          for try in $(seq 1 80); do
            token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RUNNER_URL" | jq -r .value)
            echo "::add-mask::$token"
            rm -f result.json
            code=$(curl -sS --max-time 240 -o result.json -w '%{http_code}' -X POST "$RUNNER_URL" \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data '{"mode":"apply"}') || true
            unset token
            # A 401 counts as final only if it is the runner's own refusal; Supabase's gateway or the old function
            # answering means the new runner isn't in place yet.
            if [ "$code" = 401 ] && ! jq -e '(.error // "") | startswith("refused: ")' result.json > /dev/null 2>&1; then code=not-ready; fi
            case "$code" in
              200|500|400|401|405|413) break ;;
              *) echo "runner not ready yet ($code), try $try of 80"; sleep 30 ;;
            esac
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          jq . result.json || cat result.json
          [ "$code" = 200 ] && jq -e '.ok == true' result.json > /dev/null

      - name: Record the result (run summary and the merged pull request)
        if: always() && steps.run.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          [ -f result.json ] || echo '{"ok":false,"error":"the runner never answered"}' > result.json
          {
            echo "## Database migrations at ${SHA:0:7}"
            echo
            jq -r '"- Result: " + (if .ok then "passed" else "FAILED" end),
                   "- Fresh build (reset): " + (if .reset then "yes" else "no" end),
                   "- Applied: " + ((.applied // []) | if length == 0 then "nothing new" else join(", ") end),
                   "- Migrations on main: " + ((.total // "?") | tostring),
                   (if (.failed // []) | length > 0 then "- Checks failed: " + (.failed | join("; ")) else empty end),
                   (if .error then "- Error: " + .error else empty end),
                   (if (.warnings // []) | length > 0 then "- Left over (not a failure): " + (.warnings | join("; ")) else empty end),
                   (if (.notices // []) | length > 0 then "- Notes: " + (.notices | join("; ")) else empty end)' result.json
            echo
            echo "Run: $RUN_URL"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          pr=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" --jq '.[0].number // empty' || true)
          if [ -n "$pr" ]; then gh api "repos/${{ github.repository }}/issues/$pr/comments" -F body=@summary.md > /dev/null || true; fi

  drift:
    # Daily, and after every merge that changes the database: the live ledger must equal db/manifest.json on main.
    # A difference means something changed the database outside a merged PR. It alerts; it never changes anything.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [migrate]
    if: always() && github.ref == 'refs/heads/main' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    env:
      RUNNER_URL: https://nksagchwpyljvjiwolmp.supabase.co/functions/v1/dog-migrate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            /db/manifest.json
          sparse-checkout-cone-mode: false

      - name: Compare the live ledger with main
        id: drift
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$RUNNER_URL" | jq -r .value)
          echo "::add-mask::$token"
          code=$(curl -sS --max-time 60 -o status.json -w '%{http_code}' -X POST "$RUNNER_URL" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data '{"mode":"status"}') || true
          unset token
          [ "$code" = 200 ] || { echo "drift check: the runner answered $code"; echo "result=unreachable" >> "$GITHUB_OUTPUT"; exit 0; }
          live=$(jq -c '[.ledger[] | [.version, .sha256]] | sort' status.json)
          want=$(jq -c '[.migrations[] | [.version, .sha256]] | sort' db/manifest.json)
          if [ "$live" = "$want" ]; then echo "result=same" >> "$GITHUB_OUTPUT"; echo "No drift: the live database matches main."
          else echo "result=drift" >> "$GITHUB_OUTPUT"; echo "DRIFT: the live database does not match main."; fi
          jq -r --argjson want "$want" '[.ledger[] | [.version, .sha256]] as $live
            | "Only live: " + ([$live[] | select(. as $x | $want | index([$x]) | not) | .[0]] | join(", ")) + "\nOnly on main: "
            + ([$want[] | select(. as $x | $live | index([$x]) | not) | .[0]] | join(", "))' status.json > diff.txt

      - name: Alert on drift
        if: always() && (failure() || steps.drift.outputs.result == 'drift' || steps.drift.outputs.result == 'unreachable')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ steps.drift.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh api "repos/$REPO/labels/jevs-alert" > /dev/null 2>&1 || \
            gh api "repos/$REPO/labels" -f name=jevs-alert -f color=b60205 -f description='JEVs flagged a post for review' > /dev/null
          issue=$(gh api "repos/$REPO/issues?labels=jevs-alert&state=open&per_page=1" --jq '.[0].number // empty')
          [ -n "$issue" ] || issue=$(gh api "repos/$REPO/issues" -f title='JEVs alerts' -f body='JEVs adds a comment here for every post it flags, every run that fails, and any database drift.' -f 'labels[]=jevs-alert' --jq .number)
          if [ -z "$RESULT" ]; then
            printf 'The drift check itself failed, so the database was not compared with main. Run: %s\n' "$RUN_URL" > alert.txt
          elif [ "$RESULT" = drift ]; then
            { echo "Database drift: the live database doesn't match the migrations on main. Something changed it outside a merged PR."; echo; cat diff.txt; echo; echo "Run: $RUN_URL"; } > alert.txt
          else
            printf 'The drift check could not reach the database runner. Run: %s\n' "$RUN_URL" > alert.txt
          fi
          gh api "repos/$REPO/issues/$issue/comments" -F body=@alert.txt > /dev/null
