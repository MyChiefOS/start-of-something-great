# Applies the database migrations to production, then runs the coverage check against it.
# Started by hand only (Actions tab, "Database migrations", Run workflow); never on a schedule or a push.
# Its secrets live in the protected "production" environment (db/README.md, step 2): only main, only with Aaron's approval.
name: Database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    # Refuse any branch but main, even if the environment's branch rule were ever loosened.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Apply migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_CA: ${{ secrets.MIGRATION_DATABASE_CA }}
        run: node scripts/migrate.js

      - name: Coverage check against production (S1, S7, S8, S12, G3)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_CA: ${{ secrets.MIGRATION_DATABASE_CA }}
        run: node scripts/db-check.js
