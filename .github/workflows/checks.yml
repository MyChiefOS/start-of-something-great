# Release gates from ACCEPTANCE.md. Every tool is pinned so the same code always gets the same answer.
name: Checks

on:
  pull_request:
    # edited too, so fixing a PR description re-runs the PR guards.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# A newer push to the same pull request replaces the older run. Runs on main each get their own group
# (the run id), so they are never cancelled or replaced.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A throwaway Postgres 17 (the version Supabase runs) for the database tests: S1, S3, S7, S8, G3, G4.
    # It only accepts connections from this job and is deleted with it, so it needs no password.
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: PR guards (base is main, every commit verified and listed in the description; USE-CASES.md row 14)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/pr-guards.js

      - name: Dependency check (S11, against the locked list; a critical advisory blocks)
        run: npm audit --package-lock-only --audit-level=critical

      - name: Install the Postgres 17 tools (the restore test's pg_dump must be as new as the server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          # The key is pinned (N5): a changed download, whatever the reason, stops the job instead of installing from it.
          echo "0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76  /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc" | sha256sum -c -
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Tests (acceptance criteria, including the database coverage check)
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        # One test file at a time: each builds its own database, and Postgres roles are shared by the whole server,
        # so files running in parallel could race to create the same role on a fresh server.
        run: node --test --test-concurrency=1 test/*.test.js

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Code scan (Semgrep 1.95.0, rules saved in .semgrep/)
        run: |
          python -m pip install --quiet "semgrep==1.95.0" "setuptools==75.6.0"
          semgrep scan --config .semgrep/ --metrics=off --error api/ scripts/ db/ signin/ notify/ proposals.js shipped.js join.js signin.js feed.js review.js agents.js controls.js account.js receipt.js launch.js passkey.js

      - name: Secret scan (gitleaks 8.21.2, checksum verified)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner .
