# Release gates from ACCEPTANCE.md. Every tool is pinned so the same code always gets the same answer.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Tests (acceptance criteria)
        run: node --test test/*.test.js

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Code scan (Semgrep 1.95.0, rules saved in .semgrep/)
        run: |
          python -m pip install --quiet "semgrep==1.95.0" "setuptools==75.6.0"
          semgrep scan --config .semgrep/ --metrics=off --error api/ scripts/ proposals.js shipped.js

      - name: Secret scan (gitleaks 8.21.2, checksum verified)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner .
