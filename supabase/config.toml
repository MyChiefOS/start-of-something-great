# Supabase settings for the functions in this repository (read by the Supabase CLI and by Claude's deploy).
# dog-migrate checks its callers itself: it accepts only a GitHub Actions identity token from database.yml on main
# (supabase/functions/_shared/github-oidc.mjs). Supabase's own JWT check must be off, or it would refuse GitHub's
# token before that code runs.
[functions.dog-migrate]
verify_jwt = false

# The JEVs gate checks its callers the same way: only jevs.yml on main.
[functions.jevs]
verify_jwt = false

# The site's key broker (route B) checks its callers itself: only a production function of our own Vercel project,
# proved by Vercel's identity token (supabase/functions/_shared/vercel-oidc.mjs).
[functions.dog-keys]
verify_jwt = false

# GitHub's facts for the work module (055, RK140) check their caller the same way: only github-facts.yml on main.
[functions.dog-github]
verify_jwt = false

# The preview copy's rebuild (RK141), deployed only to the preview branch, checks its caller the same way: only
# preview-copy.yml on main, at the branch's own address.
[functions.dog-copy]
verify_jwt = false
