<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Third Look</title>
  <desc id="d">Three lenses in a row: two muted looks, the rules and Second Look, and an amber third look on finished work, with a pupil and a small glint, on Day One Great's dark ink.</desc>
  <rect width="512" height="512" rx="112" fill="#0d0f14"/>
  <!-- The first look: JEVs, the fixed rules -->
  <circle cx="176" cy="256" r="96" fill="none" stroke="#3f424b" stroke-width="16"/>
  <!-- The second look -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#5b5e68" stroke-width="16"/>
  <!-- The third look, on the audit -->
  <circle cx="336" cy="256" r="96" fill="#f2a33a" fill-opacity="0.12" stroke="#f2a33a" stroke-width="20"/>
  <circle cx="336" cy="256" r="32" fill="#f2a33a"/>
  <circle cx="348" cy="244" r="9" fill="#ece7dd"/>
</svg>
