<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Second Look</title>
  <desc id="d">Two lenses, one behind the other: a muted first look and an amber second look, with a pupil and a small glint, on Day One Great's dark ink.</desc>
  <defs>
    <clipPath id="front"><circle cx="300" cy="256" r="118"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0d0f14"/>
  <!-- The first look: JEVs, the fixed rules -->
  <circle cx="212" cy="256" r="118" fill="none" stroke="#5b5e68" stroke-width="18"/>
  <!-- Where the two looks overlap -->
  <circle cx="212" cy="256" r="118" fill="#f2a33a" fill-opacity="0.14" clip-path="url(#front)"/>
  <!-- The second look -->
  <circle cx="300" cy="256" r="118" fill="none" stroke="#f2a33a" stroke-width="22"/>
  <circle cx="300" cy="256" r="38" fill="#f2a33a"/>
  <circle cx="314" cy="242" r="10" fill="#ece7dd"/>
</svg>
