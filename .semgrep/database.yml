rules:
# Our own rules for S8 (every database query uses parameters) and S1 (who is acting is set in one place).
# Written for this repository; MIT like the code. test/db.test.js checks the same things without Semgrep.
- id: dayonegreat.db.no-raw-sql
  message: Raw SQL (unsafe) can put values into a query as text instead of parameters. Use a tagged template
    (t`... ${value}`) through db/index.js. Only scripts/migrate.js (from migration files) and scripts/setup-production.js (fixed role and trigger statements, pinned by test/setup.test.js) may run raw SQL.
  languages: [javascript]
  severity: ERROR
  paths:
    exclude: [scripts/migrate.js, scripts/setup-production.js, test/]
  pattern-either:
  - pattern: $X.unsafe(...)
  - pattern: $X['unsafe'](...)
  - pattern: $X["unsafe"](...)
- id: dayonegreat.db.driver-only-in-db
  message: Load the database through db/index.js, which enforces the pooler (G1), parameters (S8) and
    per-transaction identity (S1).
  languages: [javascript]
  severity: ERROR
  paths:
    exclude: [db/index.js, test/]
  pattern-either:
  - pattern: require('postgres')
  - pattern: import $X from 'postgres'
  - pattern: import * as $X from 'postgres'
  - pattern: import { ... } from 'postgres'
  - pattern: import('postgres')
- id: dayonegreat.db.identity-only-in-db
  message: Who is acting is set only by db/index.js at the start of each transaction. Changing it elsewhere, or
    keeping state past a transaction (session settings, roles, cursors WITH HOLD, temporary tables), could let one
    request act as another on a pooled connection.
  languages: [generic]
  severity: ERROR
  paths:
    include: ['*.js']
    exclude: [db/index.js, scripts/migrate.js, scripts/setup-production.js, test/]
  pattern-regex: (?i)(set_config|app\.(actor|member_id|agent_id|note|fresh|session)\b|\bset\s+(local\s+)?(session|role|app\.)|\breset\s+(role|session)\b|\bwith\s+hold\b|\bcreate\s+temp)
- id: dayonegreat.routeb.identity-token-only-to-broker
  message: Vercel's identity token proves the site to the key broker (route B). Read it only in db/sitekeys.js, which
    sends it only to the broker's fixed address, and in api/ready.js, which only checks that it arrived. Forwarding it
    anywhere else would let that place ask the broker for the site's keys (the CSO's control 8).
  languages: [javascript]
  severity: ERROR
  paths:
    exclude: [db/sitekeys.js, api/ready.js, test/]
  pattern-either:
  - pattern: $X['x-vercel-oidc-token']
  - pattern: $X["x-vercel-oidc-token"]
  - pattern: $X.get('x-vercel-oidc-token')
  - pattern: process.env.VERCEL_OIDC_TOKEN
  - pattern: getVercelOidcToken(...)
- id: dayonegreat.routeb.no-whole-header-copies
  message: A request's headers can carry Vercel's identity token (route B). Don't send, spread, serialise or log them
    whole; pick the headers you need by name (the CSO's review of route B, M3). db/sitekeys.js also removes the token
    from the request as soon as it is read.
  languages: [javascript]
  severity: ERROR
  paths:
    exclude: [test/]
  patterns:
  - pattern-either:
    - pattern: 'fetch(..., { ..., headers: $R.headers, ... })'
    - pattern: '{ ..., ...$R.headers, ... }'
    - pattern: JSON.stringify($R.headers, ...)
    - pattern: console.$F(..., $R.headers, ...)
  - metavariable-regex:
      metavariable: $R
      regex: ^(req|request|r)$
